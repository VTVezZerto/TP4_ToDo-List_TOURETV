<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List_Valentin_TOURET</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <h1>Ma Liste de Tâches</h1>

    <div class="input-section">
        <input type="text" id="task-input" placeholder="Ajouter une nouvelle tâche..." autocomplete="off">
        <button id="add-btn">Ajouter</button>
    </div>

    <div class="counter-section">
        <p>Tâches restantes : <span id="task-counter">0</span></p>
    </div>

    <ul id="task-list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
